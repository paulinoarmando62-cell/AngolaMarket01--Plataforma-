<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner shine border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Center Branding Group -->
  <g filter="url(#shadow)">
    <!-- Shopping Bag Outline Accent -->
    <path d="M196 170 C196 136 222 108 256 108 C290 108 316 136 316 170" fill="none" stroke="#FDE047" stroke-width="20" stroke-linecap="round"/>
    
    <!-- AO Text -->
    <text x="180" y="325" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">AO</text>
    
    <!-- 01 Text in Gold -->
    <text x="345" y="325" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="-4">01</text>
  </g>

  <!-- Bottom Tagline Pill -->
  <rect x="116" y="375" width="280" height="46" rx="23" fill="#1C1917" fill-opacity="0.85"/>
  <text x="256" y="405" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANGOLAMARKET</text>
</svg>