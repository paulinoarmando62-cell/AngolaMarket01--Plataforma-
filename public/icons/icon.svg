<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B80000" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  
  <!-- Red Rounded Card Background -->
  <rect width="512" height="512" rx="112" fill="url(#redGrad)"/>
  
  <!-- Subtle White Border Gloss -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Center White Emblem Bag -->
  <g filter="url(#cardShadow)">
    <!-- Shopping Bag Handle -->
    <path d="M206 170 C206 138 228 112 256 112 C284 112 306 138 306 170" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    
    <!-- Central AO Emblem -->
    <text x="185" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="165" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">AO</text>
    
    <!-- 01 in Gold/White Accent -->
    <text x="345" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="165" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="-4">01</text>
  </g>

  <!-- Bottom Brand Pill -->
  <rect x="106" y="375" width="300" height="48" rx="24" fill="#FFFFFF"/>
  <text x="256" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#B80000" text-anchor="middle" letter-spacing="2">ANGOLAMARKET</text>
</svg>